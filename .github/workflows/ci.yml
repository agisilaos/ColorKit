name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Ensure we don't run on draft PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  documentation:
    name: Documentation
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build DocC Documentation
        run: |
          xcodebuild docbuild \
            -scheme ColorKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ColorKitDocumentation" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            'OTHER_DOCC_FLAGS=--warnings-as-errors'

  test:
    name: Build and Test
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode and Available Simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Set up caching of Swift package dependencies
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      # Set up build cache
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-derived-data-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-derived-data-

      - name: Build and Test iOS
        id: ios_tests
        run: |
          mkdir -p TestResults
          scripts/run_tests.sh --log-file TestResults/iOS.log \
            iOS 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -skip-testing:ColorKitTests/ColorCacheIntegrationTests \
            -skip-testing:ColorKitTests/ThemeManagerIntegrationTests \
            -resultBundlePath TestResults/iOS.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build and Test macOS
        if: ${{ !cancelled() && (steps.ios_tests.outcome == 'success' || steps.ios_tests.outcome == 'failure') }}
        run: |
          mkdir -p TestResults
          scripts/run_tests.sh --log-file TestResults/macOS.log \
            macOS 'platform=macOS' \
            -skip-testing:ColorKitTests/ColorCacheIntegrationTests \
            -skip-testing:ColorKitTests/ThemeManagerIntegrationTests \
            -resultBundlePath TestResults/macOS.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation

      # Singleton tests mutate global state and run outside the parallel suite.
      - name: Test Shared State iOS
        if: ${{ !cancelled() && (steps.ios_tests.outcome == 'success' || steps.ios_tests.outcome == 'failure') }}
        run: |
          mkdir -p TestResults
          scripts/run_tests.sh --log-file TestResults/SharedStateiOS.log \
            iOS 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -parallel-testing-enabled NO \
            -only-testing:ColorKitTests/ColorCacheIntegrationTests \
            -only-testing:ColorKitTests/ThemeManagerIntegrationTests \
            -resultBundlePath TestResults/SharedStateiOS.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Test Shared State macOS
        if: ${{ !cancelled() && (steps.ios_tests.outcome == 'success' || steps.ios_tests.outcome == 'failure') }}
        run: |
          mkdir -p TestResults
          scripts/run_tests.sh --log-file TestResults/SharedStatemacOS.log \
            macOS 'platform=macOS' \
            -parallel-testing-enabled NO \
            -only-testing:ColorKitTests/ColorCacheIntegrationTests \
            -only-testing:ColorKitTests/ThemeManagerIntegrationTests \
            -resultBundlePath TestResults/SharedStatemacOS.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure() # Upload even if tests fail
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
