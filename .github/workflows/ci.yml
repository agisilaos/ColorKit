name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Ensure we don't run on draft PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  documentation:
    name: Documentation
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build DocC Documentation
        run: |
          xcodebuild docbuild \
            -scheme ColorKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ColorKitDocumentation" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            'OTHER_DOCC_FLAGS=--warnings-as-errors'

      - name: Compile Public Examples and Verify Conversion Results
        run: python3 scripts/check_documentation.py --derived-data "$RUNNER_TEMP/ColorKitDocumentation"

  test:
    name: Build and Test
    runs-on: macos-26
    if: github.event.pull_request.draft == false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode and Available Simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Set up caching of Swift package dependencies
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: Test Tooling Contracts
        run: python3 -m unittest discover -s scripts/tests

      - name: Build and Test Canonical Matrix
        run: scripts/run_tests.sh --results-dir TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure() # Upload even if tests fail
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
